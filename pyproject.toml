[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "offerpilot"
version = "0.1.0"
description = "Evidence-backed job search tracking and interview preparation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OfferPilot Contributors" }]
maintainers = [{ name = "OfferPilot Maintainers" }]
keywords = [
  "ai",
  "career",
  "evidence",
  "interview-prep",
  "job-search",
  "source-urls",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.4",
  "twine>=5.0",
]

[project.scripts]
offerpilot = "offerpilot.cli:main"

[project.urls]
Homepage = "https://github.com/zhuanzmima0000/awesome-OfferPilot"
Repository = "https://github.com/zhuanzmima0000/awesome-OfferPilot"
Issues = "https://github.com/zhuanzmima0000/awesome-OfferPilot/issues"
Changelog = "https://github.com/zhuanzmima0000/awesome-OfferPilot/blob/main/CHANGELOG.md"
Documentation = "https://github.com/zhuanzmima0000/awesome-OfferPilot#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offerpilot = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
