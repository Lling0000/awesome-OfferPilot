name: Bug report
description: Report a reproducible OfferPilot bug using fictional data.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include real resumes, interview notes, recruiter messages, voice files, cookies, tokens, or private job-search data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Use fictional inputs and include commands, URLs, or UI steps.
      placeholder: |
        1. Run `offerpilot demo --reset`
        2. Open `/intelligence`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OfferPilot Version Or Commit
      description: Paste the package version, commit SHA, or branch name if you know it.
      placeholder: "0.1.0, main, or a commit SHA"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - CLI
        - Job link intake
        - Source-backed reports
        - Interview audio or notes
        - Daily intelligence
        - Provider adapters
        - Packaging or CI
        - Documentation
  - type: textarea
    id: verification
    attributes:
      label: Local Checks
      description: Include relevant `ruff`, `pytest`, `doctor`, CLI, or HTTP smoke output.
      placeholder: |
        python -m pytest
        offerpilot doctor --strict-publish
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy Check
      options:
        - label: I removed real candidate data, secrets, tokens, cookies, and private files.
          required: true
